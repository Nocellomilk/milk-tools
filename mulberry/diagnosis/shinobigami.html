<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>マルベリー魔法学院 入学適性検査</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Kosugi+Maru&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Hina+Mincho&display=swap');
:root{
 --night:#07171d;--deep:#0d2932;--paper:#f5f7f3;--paper2:#e9efeb;
 --ink:#173039;--muted:#667a7d;--line:#9db6b3;--teal:#356e73;--violet:#6d6688;
}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{
 margin:0;min-height:100vh;color:var(--ink);
 font-family:"Hina Mincho","Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
 background:
  radial-gradient(circle at 50% -10%,#29505c 0,transparent 38%),
  linear-gradient(180deg,#0b242d 0,#07171d 72%);
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;
 background-image:
  linear-gradient(30deg,transparent 49.5%,#b9d3cf22 50%,transparent 50.5%),
  linear-gradient(150deg,transparent 49.5%,#b9d3cf18 50%,transparent 50.5%);
 background-size:80px 138px;
}
.wrap{width:min(790px,94vw);margin:auto;padding:42px 0 70px}
.card{
 background:
  radial-gradient(circle at 50% 18%,#fff 0,transparent 28%),
  linear-gradient(135deg,var(--paper),var(--paper2));
 border:1px solid #adc2be;border-radius:3px;padding:clamp(30px,6vw,56px);
 box-shadow:0 28px 75px #0009,0 0 0 7px #17343b,0 0 0 8px #6d8b89;
 position:relative;overflow:hidden;
}
.card:before{content:"";position:absolute;pointer-events:none;inset:14px;border:1px solid #9eb5b1}
.card:after{content:"";position:absolute;pointer-events:none;left:50%;top:18px;width:120px;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#7e9996,transparent);opacity:.75}
.eyebrow{text-align:center;letter-spacing:.24em;color:#527379;font-size:.72rem;text-transform:uppercase}
h1{text-align:center;font-size:clamp(1.85rem,6vw,3rem);font-weight:500;margin:.45em 0 .18em;letter-spacing:.11em}
h1:after{content:"◇";display:block;font-size:.72rem;color:#6f8584;margin:.55rem auto 0}
.en{text-align:center;color:#75898b;letter-spacing:.18em;font-size:.68rem;margin-bottom:31px}
p{line-height:1.95}.center{text-align:center}.small{font-size:.85rem;color:var(--muted)}
.primary{
 display:block;margin:29px auto 0;min-width:210px;border:1px solid #244e55;
 background:linear-gradient(180deg,#416f75,#2b555c);color:white;
 border-radius:2px;padding:13px 30px;cursor:pointer;letter-spacing:.11em;
 box-shadow:inset 0 0 0 1px #86a7a5,0 5px 13px #17363b33;position:relative
}
.primary:before,.primary:after{content:"◇";position:absolute;top:50%;transform:translateY(-52%);font-size:.65rem;color:#b9ceca}
.primary:before{left:15px}.primary:after{right:15px}.primary:hover{filter:brightness(1.07)}
.ghost{background:none;border:0;color:#60777c;text-decoration:underline;cursor:pointer;margin-top:20px}
.progress{height:2px;background:#cbd8d5;margin:0 0 30px;position:relative}
.progress:before,.progress:after{content:"◇";position:absolute;top:-9px;color:#789391;font-size:.7rem}
.progress:before{left:-3px}.progress:after{right:-3px}
.progress>i{display:block;height:100%;background:#426f74;transition:.25s}
.qnum{text-align:center;color:#698087;font-size:.75rem;letter-spacing:.2em}
.question{text-align:center;font-size:1.3rem;margin:15px 0 29px}
.question:after{content:"◇";display:block;width:96px;margin:14px auto 0;color:#93a8a5;font-size:.7rem;letter-spacing:0;text-align:center;background:linear-gradient(#a9bbb8,#a9bbb8) left center/34px 1px no-repeat,linear-gradient(#a9bbb8,#a9bbb8) right center/34px 1px no-repeat}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.option{
 border:1px solid #aabfbb;background:#fbfcfa;color:#253d43;border-radius:2px;
 padding:14px 13px;cursor:pointer;line-height:1.5;box-shadow:inset 0 0 0 3px #f0f4f1;
 position:relative
}
.option:before{content:none}
.option:hover{background:#edf4f1;border-color:#658b89;transform:translateY(-1px)}
.result-title{text-align:center;font-size:1.55rem;font-weight:500;margin:8px 0}
.seal{
 width:82px;height:82px;border:1px solid #557a79;border-radius:50%;display:grid;place-items:center;
 margin:21px auto;color:#426d6d;font-size:1.45rem;position:relative;box-shadow:inset 0 0 0 5px #edf2ef,inset 0 0 0 6px #9cb0ad
}
.seal:after{content:"MULLBERRY";position:absolute;font-size:.48rem;letter-spacing:.15em;bottom:13px}
.result-box{border-top:1px solid #aebfbc;border-bottom:1px solid #aebfbc;padding:23px 7px;margin:24px 0;position:relative}
.result-box:before{content:"◆";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 9px;color:#78928f;font-size:.7rem}
.apt{padding:13px 15px;border-left:2px solid #557e85;background:#eef3f0;margin:10px 0;box-shadow:inset 0 0 0 1px #d3dedb}
.apt b{display:block;font-size:1.03rem;font-weight:600}.apt span{font-size:.8rem;color:#687b80;letter-spacing:.04em}
.debug{margin-top:24px;padding:14px;background:#e5ece9;border:1px dashed #a7b8b5;border-radius:2px;font-family:ui-monospace,monospace;font-size:.74rem;color:#52676c}
.black{filter:saturate(.62)}.black h2{color:#222}
@media(max-width:580px){
 .options{grid-template-columns:1fr}.wrap{padding:25px 0 55px}.card{padding:34px 23px}
 .card{box-shadow:0 20px 55px #0008,0 0 0 4px #17343b,0 0 0 5px #6d8b89}
}

.academy-mark{width:88px;height:88px;margin:8px auto 16px;position:relative;border:1px solid #5e807e;border-radius:50%;box-shadow:inset 0 0 0 5px #edf2ef,inset 0 0 0 6px #b1c1bd}
.academy-mark:before{content:"";position:absolute;left:50%;top:19px;width:1px;height:45px;background:#567c78;transform:rotate(-8deg)}
.academy-mark .leaf{position:absolute;width:19px;height:10px;border:1px solid #567c78;border-radius:100% 0 100% 0;background:#f4f7f3}
.academy-mark .l1{left:25px;top:27px;transform:rotate(18deg)}.academy-mark .l2{right:24px;top:37px;transform:rotate(198deg)}
.academy-mark .berry{position:absolute;width:8px;height:8px;border:1px solid #6b6684;border-radius:50%}
.academy-mark .b1{left:42px;top:31px}.academy-mark .b2{left:48px;top:37px}.academy-mark .b3{left:39px;top:40px}
.academy-mark .water{position:absolute;left:23px;right:23px;bottom:18px;height:8px;border-top:1px solid #73918f;border-radius:50%}
.title-ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:#78928f;margin:12px auto 20px;font-size:.68rem;letter-spacing:.16em}
.title-ornament:before,.title-ornament:after{content:"";width:62px;height:1px;background:linear-gradient(90deg,transparent,#91aaa6)}
.title-ornament:after{transform:scaleX(-1)}
.result-certificate{position:relative;padding-top:4px}
.result-certificate:before,.result-certificate:after{content:"";position:absolute;width:34px;height:34px;opacity:.58}
.result-certificate:before{left:-4px;top:-3px;border-left:1px solid #78928f;border-top:1px solid #78928f}
.result-certificate:after{right:-4px;top:-3px;border-right:1px solid #78928f;border-top:1px solid #78928f}
.certificate-label{text-align:center;color:#637d80;font-size:.72rem;letter-spacing:.24em;margin-bottom:8px}
.certificate-rule{text-align:center;color:#819895;font-size:.7rem;letter-spacing:.28em;margin:15px 0}


.academy-mark{display:none}
.academy-crest{width:150px;height:168px;margin:2px auto 10px;color:#496f70}
.academy-crest svg{width:100%;height:100%;overflow:visible}
.crest-ring,.shield,.waterline,.branch,.leaf,.laurel,.ribbon{fill:none;stroke:currentColor;stroke-width:1.45;vector-effect:non-scaling-stroke}
.crest-ring.thin{stroke-width:.7;opacity:.75}
.shield{fill:#f2f5f1;stroke-width:1.7}
.waterline{stroke:#64898a;stroke-width:1}
.branch{stroke-width:1.7}
.leaf{fill:#eef3ef}
.berry{fill:#f2f3f0;stroke:#6d6688;stroke-width:1.3}
.star{fill:#eef3ef;stroke:#6d6688;stroke-width:1}
.laurel{stroke-width:1.05}
.ribbon{fill:#eef2ef;stroke-width:1.2}
.crest-text{font-family:Georgia,"Times New Roman",serif;font-size:9px;letter-spacing:4px;fill:#526f70}

.class-panel{border:1px solid #a9bdb8;background:#f9fbf8;padding:24px clamp(16px,4vw,31px);box-shadow:inset 0 0 0 5px #edf2ee;margin:24px 0}
.class-kicker{text-align:center;letter-spacing:.2em;font-size:.72rem;color:#668083}
.class-name{text-align:center;font:500 1.5rem Georgia,serif;letter-spacing:.16em;margin:12px 0 7px;color:var(--class-color,#356e73)}
.class-name:after{content:none}
.class-desc{text-align:center;font-size:.88rem;color:#52686d}
.class-value{text-align:center;border-block:1px solid #d5e0db;margin:19px auto;padding:12px 0;font-size:.9rem}
.class-roll{text-align:center;font-size:1.05rem;margin:20px 0 5px}
.class-roll strong{font:500 2rem Georgia,serif;color:var(--class-color,#356e73)}
.class-log{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0}
.class-log div{border-bottom:1px solid #c4d3ce;padding:8px 4px;font-size:.75rem;color:#597074;text-align:center}
.class-log .active{border-color:#447a7c;color:#214f55}
.class-option{width:100%;text-align:left;margin:7px 0;padding:12px;border:1px solid #b3c8c1;background:#fcfdfa;color:#26434a;font-family:inherit;cursor:pointer}
.class-option:hover,.class-option.selected{border-color:#45757a;background:#e6f0ed}
.class-option small{display:block;color:#718389;margin-top:3px}
.class-option.no-choice{text-align:center}
@media(max-width:580px){.class-log{grid-template-columns:repeat(2,1fr)}}


/* v0.15.2 screen ornament fixes: no pale band; class divider uses real CSS lines. */
.class-divider{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto;color:#8ba39f;width:min(260px,78%);font:500 .62rem Georgia,serif;line-height:1}
.class-divider i{display:block;flex:1;height:1px;background:currentColor;opacity:.9}
.card.result-themed .class-divider{color:var(--result-main)}

/* v0.12 trial: selected-class color theme (final result screen + saved images only) */
.card.result-themed{
 --result-main:#356e73;--result-line:#9db6b3;--result-soft:#eef3f0;--result-faint:#f7faf7;
 border-color:var(--result-line);
 box-shadow:0 28px 75px #0009,0 0 0 7px #17343b,0 0 0 8px var(--result-main);
}
.card.result-themed:before{border-color:var(--result-line)}
.card.result-themed:after{background:linear-gradient(90deg,transparent,var(--result-main),transparent)}
.card.result-themed .eyebrow,.card.result-themed .certificate-label,.card.result-themed .certificate-rule,
.card.result-themed .result-title,.card.result-themed .result-certificate strong{color:var(--result-main)}
.card.result-themed .academy-crest{color:var(--result-main)}
.card.result-themed .result-certificate:before,.card.result-themed .result-certificate:after{border-color:var(--result-main)}
.card.result-themed .result-box{border-color:var(--result-line)}
.card.result-themed .result-box:before{color:var(--result-main)}
.card.result-themed .apt{border-left-color:var(--result-main);background:var(--result-soft);box-shadow:inset 0 0 0 1px var(--result-line)}
.card.result-themed .primary{border-color:var(--result-main);background:var(--result-main);box-shadow:inset 0 0 0 1px var(--result-line),0 5px 13px #17363b33}
.card.result-themed .ghost{color:var(--result-main)}

.save-card.result-themed{
 --result-main:#356e73;--result-line:#9db6b3;--result-soft:#eef3f0;--result-faint:#f7faf7;
 background:linear-gradient(180deg,#fbfcf8 0%,var(--result-faint) 100%);
 border:1px solid var(--result-line);
 box-shadow:inset 0 0 0 8px #fbfcf8,inset 0 0 0 9px var(--result-line);
}
.save-card.result-themed .save-head{border-color:var(--result-line)}
.save-card.result-themed .save-head h2,.save-card.result-themed .save-label,
.save-card.result-themed .selected-name,.save-card.result-themed .save-foot{color:var(--result-main)}
.save-card.result-themed .save-eyebrow{color:var(--result-main)}
.save-card.result-themed .exempt-grid div,.save-card.result-themed .selected-class{border-color:var(--result-line);background:var(--result-soft)}
.save-card.result-themed .roll-grid{border-color:var(--result-line)}
.save-card.result-themed .roll-cell{border-color:var(--result-line)}
.save-card.result-themed .roll-name,.save-card.result-themed .roll-num{color:var(--result-main)}
.save-card.result-themed .roll-target{color:var(--result-main)}
.save-card.result-themed .black-note{border-color:var(--result-line);background:var(--result-soft)}


/* v0.13 trial: single-ink class color + academy ornaments */
.card.result-themed{color:var(--result-main)}
.card.result-themed .result-certificate,
.card.result-themed .result-certificate p,
.card.result-themed .result-box,
.card.result-themed .result-box p,
.card.result-themed .apt,
.card.result-themed .apt b,
.card.result-themed .apt span,
.card.result-themed .small,
.card.result-themed details,
.card.result-themed summary{color:var(--result-main)}
.card.result-themed .primary{color:#fff}
.card.result-themed .result-certificate{position:relative;padding-top:8px}
.card.result-themed .result-certificate:after{
 content:"✦  ◇  ✦";display:block;position:static;border:0;margin:13px auto 0;
 width:auto;height:auto;text-align:center;font:500 .72rem Georgia,serif;
 letter-spacing:.34em;color:var(--result-main);background:none;
}
.card.result-themed .result-box{position:relative}
.card.result-themed .result-box:first-of-type:after{
 content:"◇";position:absolute;right:9px;top:7px;font:500 .65rem Georgia,serif;
 color:var(--result-line)
}

.save-card.result-themed{color:var(--result-main);position:fixed}
.save-card.result-themed h2,.save-card.result-themed h3,
.save-card.result-themed .save-section,.save-card.result-themed .save-section div,
.save-card.result-themed .save-section small,.save-card.result-themed .roll-status,
.save-card.result-themed .center,.save-card.result-themed strong{color:var(--result-main)}
.save-card.result-themed .save-head{position:relative;padding-bottom:27px}
.save-card.result-themed .save-head:after{
 content:"✦  ───  ◇  ───  ✦";position:absolute;left:0;right:0;bottom:7px;
 text-align:center;font:500 10px Georgia,serif;letter-spacing:.18em;color:var(--result-main)
}
.save-card.result-themed .save-foot{position:relative;padding-top:20px}
.save-card.result-themed .save-foot:before{
 content:"◇  ✦  ◇";position:absolute;left:0;right:0;top:0;
 text-align:center;font:500 9px Georgia,serif;letter-spacing:.24em;color:var(--result-main)
}
.save-card.result-themed .exempt-grid div,
.save-card.result-themed .selected-class{box-shadow:inset 0 0 0 1px var(--result-faint)}
.save-card.result-themed .selected-class{position:relative}
.save-card.result-themed .selected-class:before,
.save-card.result-themed .selected-class:after{
 content:"✦";position:absolute;top:10px;font:500 9px Georgia,serif;color:var(--result-line)
}
.save-card.result-themed .selected-class:before{left:12px}
.save-card.result-themed .selected-class:after{right:12px}
.save-card.result-themed .roll-grid{position:relative}

/* v0.10 trial: saveable result cards */
.save-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.save-card{position:fixed;left:-10000px;top:0;width:760px;background:#fbfcf8;color:#263f45;padding:38px 42px;box-sizing:border-box;font-family:"Hina Mincho","Yu Mincho","Hiragino Mincho ProN",serif}
.save-card h2,.save-card h3{text-align:center;font-weight:500;letter-spacing:.08em}
.save-card .save-head{text-align:center;border-bottom:1px solid #9db3ad;padding-bottom:16px;margin-bottom:22px}
.save-card .save-eyebrow{font:12px Georgia,serif;letter-spacing:.18em;color:#668083}
.save-card .save-section{margin:20px 0}
.save-card .save-label{text-align:center;font-size:13px;letter-spacing:.12em;color:#60777b;margin-bottom:10px}
.save-card .exempt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.save-card .exempt-grid div{border:1px solid #c7d5d0;padding:11px 8px;text-align:center;font-size:13px}
.save-card .selected-class{border:1px solid #b8cbc5;padding:18px 20px;text-align:center}
.save-card .selected-name{font:500 25px Georgia,serif;letter-spacing:.12em;margin:5px 0 8px}
.save-card .selected-roll{font:500 34px Georgia,serif;margin:8px 0}
.save-card .roll-grid{display:grid;grid-template-columns:repeat(6,1fr);border-block:1px solid #aebfba}
.save-card .roll-cell{text-align:center;padding:13px 4px 11px;border-right:1px solid #d3ddd9;min-width:0}
.save-card .roll-cell:last-child{border-right:0}
.save-card .roll-name{font:11px Georgia,serif;letter-spacing:.04em;white-space:nowrap}
.save-card .roll-num{font:500 29px Georgia,serif;line-height:1.2;margin:5px 0 2px}
.save-card .roll-target{font-size:10px;color:#718389}
.save-card .roll-status{font-size:10px;margin-top:5px;min-height:2.4em}
.save-card .black-note{border:1px solid #555;background:#f3f3ef;padding:14px 18px;margin:18px 0;text-align:center}
.save-card .save-foot{text-align:center;font-size:10px;color:#7a8b8d;margin-top:22px;letter-spacing:.08em}
@media(max-width:580px){.save-actions{grid-template-columns:1fr}}


/* Hina Mincho readability trial
   - Keep headings/questions in Hina Mincho
   - Make answer choices slightly larger/darker
   - Remove faux-bold from exemption field names while retaining Hina
   - Restore operational buttons to the former readable Mincho stack
   - Keep English labels/class English names in Georgia
*/
.option{
  font-size:1.02rem;
  color:#20383e;
  letter-spacing:.01em;
}
.apt b{
  font-family:"Hina Mincho","Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  font-weight:400;
  font-size:1.08rem;
  letter-spacing:.01em;
}
.primary,.ghost,.class-option,
button.save-result,button.save-detail,
.result-actions button{
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
}
.certificate-label,.eyebrow,.class-name,.class-kicker{
  font-family:Georgia,"Times New Roman",serif;
}

.class-explanation{line-height:1.8;margin-top:5px;margin-bottom:12px}
/* Full-size outline action, independent from text-link .ghost */
.share-button{display:block;width:100%;min-height:49px;margin:12px auto 0;padding:13px 24px;border:1px solid var(--result-main,#77918e);border-radius:2px;background:#fff;color:var(--result-main,#527379);font:inherit;letter-spacing:.06em;line-height:1.55;cursor:pointer;box-sizing:border-box}
.share-button:hover{background:var(--result-soft,#edf3ef)}
.share-note{font-size:.75rem;line-height:1.75;color:var(--muted);margin:8px auto 18px;text-align:left}
.export-modal{display:none;position:fixed;inset:0;z-index:1000;background:#101c20c9;padding:18px;overflow:auto;align-items:center;justify-content:center}
.export-modal.open{display:flex}
.export-dialog{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fbfcf8;border:1px solid #a9c0b9;padding:20px;color:#283c40;box-shadow:0 12px 50px #0005}
.export-dialog h3{margin:0 0 8px;font-size:1.1rem;text-align:center}
.export-dialog p{font-size:.85rem;line-height:1.8}
.export-preview{display:block;max-width:100%;max-height:55vh;margin:12px auto;border:1px solid #bdc9c5}
.export-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.export-actions a,.export-actions button{padding:10px 14px;border:1px solid #6e8d87;background:#f6faf7;color:#315a5d;text-decoration:none;font:inherit;font-size:.85rem;cursor:pointer}
.export-help{margin:12px 0 0;color:#54686a;font-size:.8rem;line-height:1.8}
.save-card .class-explanation{font-size:13px;line-height:1.75;margin:8px auto 4px;max-width:570px}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
/* v0.14 ornament-max trial — intentionally over-dressed so we can subtract later */

/* On-screen result: strengthen the same geometric vocabulary without touching crest/botanical motifs. */
.card.result-themed{
  position:relative;
  outline:1px solid var(--result-line);
  outline-offset:-7px;
}
/* Keep the base card pseudo-elements as frame/heading line.
   Do not repurpose them as corner glyphs: the base ::before uses inset:14px,
   so giving it a background would cover the whole result card. */
.card.result-themed:before{
  content:"";position:absolute;pointer-events:none;inset:14px;
  border:1px solid var(--result-line);background:transparent;padding:0;z-index:0;
}
.card.result-themed:after{
  content:"";position:absolute;pointer-events:none;left:50%;right:auto;top:18px;bottom:auto;
  width:120px;height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--result-main),transparent);
  padding:0;z-index:0;
}
.card.result-themed > *{position:relative;z-index:1}
.card.result-themed .result-certificate:after{

function expandSvgUsesForCapture(root){

   if(!href||href[0]!=='#')return;
   const ref=svg.querySelector(href);
   if(!ref)return;
   const clone=ref.cloneNode(true);
   clone.removeAttribute('id');
   const useTransform=use.getAttribute('transform');
   const refTransform=clone.getAttribute('transform');
   if(useTransform)clone.setAttribute('transform',refTransform?`${useTransform} ${refTransform}`:useTransform);
   for(const attr of [...use.attributes]){
    if(attr.name==='href'||attr.name==='xlink:href'||attr.name==='transform')continue;

   }
   use.replaceWith(clone);

 }finally{card.remove()}
}
let admissionExportUrl=null;
function closeAdmissionExport(){
 document.getElementById('admissionExportModal')?.classList.remove('open');
}
function showAdmissionExport(blob,filename){
 const modal=document.getElementById('admissionExportModal');
 const img=document.getElementById('admissionExportPreview');
 const link=document.getElementById('admissionExportDownload');
 const share=document.getElementById('admissionExportShare');
 if(admissionExportUrl)URL.revokeObjectURL(admissionExportUrl);
 admissionExportUrl=URL.createObjectURL(blob);
 img.src=admissionExportUrl;link.href=admissionExportUrl;link.download=filename;
 let file=null,canShare=false;
 try{file=new File([blob],filename,{type:'image/png'});canShare=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
 share.style.display=canShare?'inline-block':'none';
 share.onclick=async()=>{try{await navigator.share({files:[file],title:'マルベリー魔法学院 入学資格認定'})}catch(e){if(e?.name!=='AbortError')console.warn(e)}};
 modal.classList.add('open');
}
async function saveResultImage(kind){
 try{
  const blob=await renderAdmissionImage(kind);
  const filename=kind==='normal'?'mulberry_result.png':'mulberry_detail.png';
  // Mobile browsers may not honor programmatic download; preview + long press is reliable fallback.
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||('ontouchstart' in window&&innerWidth<=820);
  if(mobile){showAdmissionExport(blob,filename);return}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
 }catch(e){console.error('result image save failed:',e);alert('画像の生成中にエラーが発生しました。通信環境を確認して、もう一度お試しください。')}
}

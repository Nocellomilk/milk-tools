const normalize = s => (s || '').normalize('NFKC').replace(/[\s　]/g,'').replace(/…/g,'…');
for(let i=1;i<=44;i++){
 const input=document.getElementById('end'+String(i).padStart(2,'0'));
 try{input.value=localStorage.getItem('hcr_input_'+i)||'';}catch(e){input.value='';}
 input.addEventListener('input',()=>{try{localStorage.setItem('hcr_input_'+i,input.value);}catch(e){}});
}
document.getElementById('check').addEventListener('click',()=>{
 let count=0;
 for(let i=1;i<=44;i++){
  const expected=answers[i-1];
  const val=document.getElementById('end'+String(i).padStart(2,'0')).value;
  if(expected && normalize(val)===normalize(expected))count++;
 }
 const level=count>=10?5:count>=4?4:count>=3?3:count>=2?2:count>=1?1:0;
 try{sessionStorage.setItem('hcr_access_level',String(level));localStorage.setItem('hcr_access_level',String(level));}catch(e){}

 document.getElementById('result').hidden=true;
});

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新作ゲーム｜導入先行公開</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sumi:#15110f;--shu:#b5301f;--shud:#8a2216;--kin:#c9a96b;--washi2:#e8dec9;--ink:#2a2220;--mute:#75665a;--rule:#cdbb97;--fd:'Shippori Mincho','Noto Serif JP','Yu Mincho',serif;--fb:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:auto}body{margin:0;color:var(--ink);font:400 15px/1.8 var(--fb);background:#100c0a}button{cursor:pointer;background:#fffaf0;border:1px solid #b7a384;color:var(--ink);border-radius:2px;padding:10px 14px;font:inherit}button:hover{background:#fff;border-color:var(--shu)}button.primary{background:var(--shu);color:white;border-color:var(--kin);font:700 1.05rem var(--fd);letter-spacing:.2em;padding:14px}button.primary:hover{background:var(--shud)}:focus-visible{outline:2px solid var(--kin);outline-offset:3px}.hidden{display:none!important}


body.intro-reading > header.mast,body.intro-reading > main.page{display:none}
#introOverlay{z-index:30;background:radial-gradient(ellipse at 50% 0%,#6b241a 0%,#251611 46%,#100c0a 100%);display:block;padding:clamp(16px,4vw,44px) 14px 60px;overflow:auto}
.intro-dialog{width:min(850px,100%);margin:0 auto;background:linear-gradient(#fffaf2,#f3ebdf);padding:clamp(22px,5vw,48px);border-top:14px solid var(--shu);outline:1px solid var(--kin);outline-offset:-9px;box-shadow:0 22px 65px #0008}
.intro-kicker{font:600 .82rem var(--fd);letter-spacing:.2em;color:var(--shud);margin:0 0 10px;text-align:center}
.intro-heading{display:flex;align-items:center;gap:10px;font:800 clamp(1.35rem,3vw,1.85rem) var(--fd);letter-spacing:.16em;text-align:center;margin:0 0 28px;padding-bottom:10px;border-bottom:1px solid var(--rule);color:var(--sumi)}
.intro-heading:before{content:"";width:6px;height:1.15em;background:var(--shu);flex:none}
.intro-content{font:400 1rem/2.05 var(--fb);color:var(--ink)}
.intro-content p{margin:0 0 1.2em}
.intro-content .intro-speaker{font:700 1rem var(--fd);letter-spacing:.12em;color:var(--shud);margin:28px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.intro-content .intro-speech{font-family:var(--fd);padding-left:1.1em;text-indent:-1.1em;margin-bottom:.65em}
.intro-content .intro-last{margin-top:22px;font-weight:600;font-size:24px;line-height:1.85}
.intro-content .intro-reaction{margin-top:2.7em}
.intro-content .intro-warning{background:var(--washi2);padding:18px;border-left:4px solid var(--kin)}
.intro-controls{display:flex;justify-content:flex-end;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:22px;margin-top:30px}
.intro-controls button.primary{min-width:190px}
.intro-skip{font-size:.83rem;color:var(--mute);background:transparent;border-color:var(--rule)}
@media(max-width:520px){.intro-dialog{padding:28px 21px}.intro-content{font-size:.94rem;line-height:1.95}.intro-controls button.primary{min-width:135px}}

#introOverlay{position:relative;inset:auto;min-height:100vh;overflow:visible;z-index:auto}
.intro-kicker{display:none!important}
.intro-controls{justify-content:flex-end}
#teaserEnd{min-height:100vh;display:grid;place-items:center;padding:30px 14px;background:radial-gradient(ellipse at 50% 0%,#6b241a 0%,#251611 46%,#100c0a 100%)}
.end-panel{width:min(650px,100%);padding:clamp(30px,6vw,54px);background:linear-gradient(#fffaf2,#f3ebdf);border-top:14px solid var(--shu);outline:1px solid var(--kin);outline-offset:-9px;box-shadow:0 22px 65px #0008;text-align:center}
.end-panel h2{font:800 clamp(1.35rem,4vw,1.85rem) var(--fd);letter-spacing:.15em;margin:0 0 20px}
.end-panel p{font-size:.93rem;color:var(--mute);margin:0 0 25px}
.prep-track{height:13px;border:1px solid #bba783;background:#e5d8c5;padding:2px;max-width:400px;margin:0 auto 12px;overflow:hidden}
.prep-fill{display:block;width:35%;height:100%;background:linear-gradient(90deg,#8a2216,#b5301f);transition:width 7s linear;will-change:width}
#teaserEnd.is-visible .prep-fill{width:85%}
@media(prefers-reduced-motion:reduce){.prep-fill{transition:none}}
.prep-label{font:600 .8rem var(--fd);letter-spacing:.12em;color:var(--shud)}
</style></head><body>
<main id="introOverlay" aria-label="新作ゲームの導入シナリオ"><div class="intro-dialog">
<h2 class="intro-heading" id="introHeading">はじめに</h2>
<div class="intro-content" id="introContent"></div>
<div class="intro-controls"><button type="button" class="primary" id="introNext">導入を見る</button></div>
</div></main>
<section id="teaserEnd" class="hidden" aria-label="予告編の終わり"><div class="end-panel">
<h2>手続き準備中</h2><p>審神者登録の手続きは、現在準備中です。</p>
<div class="prep-track" role="img" aria-label="準備中を表す装飾ゲージ"><span class="prep-fill"></span></div>
<div class="prep-label">準備中</div>
</div></section>
<script>
(function(){
const el=id=>document.getElementById(id);
const pages=[
{heading:'はじめに',kicker:'',items:[
 ['warning','本作には、刀剣男士との恋愛要素、および刀剣男士との間に子供が生まれる展開が含まれます。'],
 ['n','年齢制限を要する内容や、性的な描写はありません。'],
 ['n','なお、この導入シーンには恋愛要素や過激な描写は含まれません。']
]},
{heading:'死の呪い',kicker:'',items:[
 ['n','あなたは、審神者を目指す候補生のひとりである。'],
 ['n','ある日、あなたは真っ黒い翼を持った異様な姿の怪異に襲われた。'],
 ['n','幸いにも命は助かったが、身体には奇妙な痣が残された。'],
 ['n','政府による調査の結果、それは何らかの呪いによるものと判明した。'],
 ['n','そして、その呪いに詳しいという政府所属の三日月宗近が、あなたに事情を説明することとなった。'],
 ['speaker','三日月宗近'],
 ['s','「おお、来たか。待っていたぞ」'],
 ['s','「俺は三日月宗近。政府に頼まれて、呪いの話をすることになった」'],
 ['s','「さて、どこから話したものかな。まあ、まずは肝心なことから伝えるとするか」'],
 ['s','「お前にかけられたのは、死の呪いだ」'],
 ['s','「このままでは、四年後には命を落とすことになるな。ははは」'],
 ['n','あまりにもあっさりと告げられた余命に、あなたは思わず言葉を返した。'],
 ['n','しかし、三日月は少しも慌てた様子を見せない。'],
 ['s','「はっはっは。まあ、そういう反応にもなるか」'],
 ['s','「とはいえ、お前も生きたいだろう？」'],
 ['s','「なに、そう難しい顔をするな。そのために俺が来たのだからな」'],
 ['s','「これから言うことに従ってくれればよい。そうすれば、助かる道もある」'],
 ['s','「四年……いや、衰えてゆく力と、この先の戦いを考えれば、三年か」'],
 ['last','「三年以内に、刀剣男士の子を産んでくれ」']
]},
{heading:'生き延びる方法',kicker:'',items:[
 ['speaker','三日月宗近'],
 ['s','「……と、突然言われてもわからんか。ははは、すまんな」'],
 ['s','「お前も審神者候補生ならば、時間遡行軍の名くらいは知っているだろう？」'],
 ['s','「此度の件には、あれらが関わっている」'],
 ['s','「どうやら、お前の子は将来、たいそう優れた審神者になる運命にあるらしい」'],
 ['s','「それが敵には邪魔で邪魔で仕方がない。ならば、生まれる前にどうにかしてしまおう、というわけだな」'],
 ['s','「さて、ではなぜ、その子を産めと言うのか」'],
 ['s','「言った通り、お前に残された命は四年。その間に、呪いの元を断ってしまえばよい」'],
 ['s','「お前の子が、な」'],
 ['s','「ただし、普通に人の子を育てていては間に合わん。生まれたばかりの赤子に戦えと言うわけにもいくまい？」'],
 ['s','「だが、俺の加護があり、相手が刀剣男士であれば話は別だ」'],
 ['s','「すぐにでも子を設けられようし、育つのも早い。戦う力も備わるだろう」'],
 ['s','「なあに、案ずることはない」'],
 ['s','「資源とやらも、政府の者が多少は気を利かせてくれるそうだ」'],
 ['s','「相手も、いくらか選べるぞ。よかったな。はっはっは」'],
 ['reaction','あなたは、近くで待機していた政府職員に助けを求めるような視線を向けた。'],
 ['n','しかし、職員はただ、頑張ってくださいとでも言いたげに、深く頷くばかりだった。'],
 ['n','こうして、あなたの波乱に満ちた審神者生活が幕を開けたのだった。']
]}];
let page=0;
function renderPage(){
 const p=pages[page];el('introHeading').textContent=p.heading;
 el('introContent').replaceChildren();
 for(const [type,t] of p.items){const node=document.createElement('p');node.textContent=t;node.className=type==='speaker'?'intro-speaker':type==='s'?'intro-speech':type==='last'?'intro-speech intro-last':type==='warning'?'intro-warning':type==='reaction'?'intro-reaction':'';el('introContent').append(node)}
 el('introNext').textContent=page===0?'導入を見る':'次へ';
 window.scrollTo(0,0);
}
function finish(){el('introOverlay').classList.add('hidden');el('teaserEnd').classList.remove('hidden');window.scrollTo(0,0);requestAnimationFrame(()=>requestAnimationFrame(()=>el('teaserEnd').classList.add('is-visible')))}
el('introNext').addEventListener('click',()=>{if(page===pages.length-1)finish();else{page++;renderPage()}});

document.body.classList.add('intro-reading');renderPage();
})();
</script></body></html>
